name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native core and module tools (host tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build lld clang
      - name: Vulkan headers for the host build
        run: git clone --depth 1 --branch v1.3.275 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/Vulkan-Headers"
      - name: Configure and build
        run: |
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DFHCORE_VULKAN_HEADERS="$RUNNER_TEMP/Vulkan-Headers/include"
          cmake --build build/native
      - name: Unit tests (XEX2 parser, ELF inspector, load-order planner)
        run: ctest --test-dir build/native --output-on-failure
      - name: Module pipeline test (synthetic AArch64 backend)
        run: python3 -I tools/tests/test_module_pipeline.py build/native/fhinspect
      - name: Catalog is reproducible metadata only
        run: python3 -c "import json;d=json.load(open('app/src/main/assets/catalog/fh1-catalog.json'));assert d['dumps'][0]['file_count']==2400;print('catalog ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: fhinspect-linux-x86_64
          path: build/native/fhinspect

  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    needs: native
    env:
      HAS_RELEASE_KEY: ${{ secrets.FHORIZON_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pick the installed NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          NDK_VERSION=$(basename "${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)}")
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
          echo "Using NDK $NDK_VERSION"
      - name: Release signing key (optional secret)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FHORIZON_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "FHORIZON_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Unit tests and APK build
        env:
          FHORIZON_KEYSTORE_PASSWORD: ${{ secrets.FHORIZON_KEYSTORE_PASSWORD }}
          FHORIZON_KEY_ALIAS: ${{ secrets.FHORIZON_KEY_ALIAS }}
          FHORIZON_KEY_PASSWORD: ${{ secrets.FHORIZON_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace -PfhNdkVersion=$NDK_VERSION testDebugUnitTest assembleRelease assembleDebug
      - name: Check the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/apk/*/
          unzip -l "$APK" | grep -E 'lib/|classes|catalog' || true
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfhcore.so'
          if unzip -l "$APK" | grep -qE 'lib/(armeabi|x86)'; then echo "unexpected ABI in APK"; exit 1; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | head -20
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" "FHorizonMobile-${GITHUB_SHA::7}-arm64-v8a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FHorizonMobile-apk
          path: |
            FHorizonMobile-*-arm64-v8a.apk
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
      - name: GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "FHorizonMobile-${GITHUB_SHA::7}-arm64-v8a.apk" "FHorizonMobile-${GITHUB_REF_NAME}-arm64-v8a.apk"
          gh release create "$GITHUB_REF_NAME" "FHorizonMobile-${GITHUB_REF_NAME}-arm64-v8a.apk" \
            --title "FHorizon Mobile $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md || \
          gh release upload "$GITHUB_REF_NAME" "FHorizonMobile-${GITHUB_REF_NAME}-arm64-v8a.apk" --clobber
